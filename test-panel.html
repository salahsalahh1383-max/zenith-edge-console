<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل تست Zenith</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#e7eef8;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{font-size:24px;font-weight:bold;color:#65e6b0}.ok{background:#103829;border:1px solid #2a9b70;border-radius:20px;padding:8px 14px;color:#9ff1ca;font-size:13px}.hero,.card{background:#101d30;border:1px solid #263b58;border-radius:18px;padding:24px;box-shadow:0 14px 40px #0004}.hero h1{margin:0 0 12px;font-size:30px}.muted{color:#9cafc8;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{padding:18px}.num{font-size:28px;font-weight:bold;margin-top:10px}.button{margin-top:20px;background:#65e6b0;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;color:#062018}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}

</head>
<body><main class="wrap"><header class="top"><div class="logo">ZENITH TEST PANEL</div><div class="ok">● تست رابط کاربری</div></header><section class="hero"><h1>پنل تست با موفقیت بارگذاری شد</h1><p class="muted">این صفحه فقط برای تست بازشدن و نمایش رابط است. هیچ توکن، رمز یا اتصال واقعی به Cloudflare و تلگرام ندارد.</p><button class="button" onclick="alert('پنل تست سالم است')">تست دکمه</button></section><section class="grid"><div class="card"><div class="muted">کاربران</div><div class="num">0</div></div><div class="card"><div class="muted">کانفیگ‌ها</div><div class="num">0</div></div><div class="card"><div class="muted">وضعیت</div><div class="num" style="color:#65e6b0">آماده</div></div></section></main></body></html>
